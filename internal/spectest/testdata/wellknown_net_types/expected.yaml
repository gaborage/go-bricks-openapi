components:
  schemas:
    Addrs:
      type: object
      properties:
        addr:
          type: string
        addrList:
          type: array
          items:
            type: string
          maxItems: 2
        addrPort:
          type: string
        alias:
          type: string
        bounded:
          type: string
        byHost:
          type: object
          additionalProperties:
            type: string
        defAddr:
          type: object
        defPrefix:
          type: object
        defined:
          type: string
          format: byte
        ip:
          type: string
          example: 1.2.3.4
        ips:
          type: array
          items:
            type: string
          maxItems: 3
        oneOf:
          type: string
          enum:
            - 1.2.3.4
            - 5.6.7.8
        port:
          type: string
        prefix:
          type: string
        prefixes:
          type: array
          items:
            type: string
        ptrAddr:
          type: string
          nullable: true
        ptrIP:
          type: string
          nullable: true
        ptrV4:
          type: string
          format: ipv4
          nullable: true
        ten:
          type: string
          pattern: ^10\.
        v4:
          type: string
          format: ipv4
        v6List:
          type: array
          items:
            type: string
            format: ipv6
          maxItems: 2
      required:
        - ip
    EmbDefAddr:
      type: object
      properties:
        "n":
          type: integer
          format: int64
    EmbMode:
      type: object
      properties:
        FileMode:
          type: integer
          format: int64
          minimum: 0
        "n":
          type: integer
          format: int64
    Embeds:
      type: object
      properties:
        addr:
          type: string
        addrPort:
          type: string
        defAddr:
          $ref: '#/components/schemas/EmbDefAddr'
        ip:
          type: string
        mode:
          $ref: '#/components/schemas/EmbMode'
        prefix:
          type: string
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Machine-readable error code (e.g. BAD_REQUEST, NOT_FOUND, INTERNAL_ERROR, or a custom business code)
            details:
              type: object
              properties:
                validationErrors:
                  type: array
                  description: Per-field validation failures (400 validation errors)
                  items:
                    type: object
                    properties:
                      field:
                        type: string
                        description: Field that failed validation
                      message:
                        type: string
                        description: Violated validation rule
                      value:
                        description: Submitted value (any type)
                  maxItems: 100
              description: Contextual error payload, emitted in development environments only
            message:
              type: string
              description: Human-readable error message
          description: Error details
        meta:
          type: object
          properties:
            timestamp:
              type: string
              format: date-time
              description: RFC3339 response timestamp
            traceId:
              type: string
              description: W3C trace identifier for the request
      required:
        - error
    Modes:
      type: object
      properties:
        alias:
          type: integer
          format: int64
          minimum: 1
        byName:
          type: object
          additionalProperties:
            type: integer
            format: int64
            minimum: 0
        fsMode:
          type: integer
          format: int64
          example: 420
          minimum: 0
        list:
          type: array
          items:
            type: integer
            format: int64
            minimum: 0
        mode:
          type: integer
          format: int64
          minimum: 0
          maximum: 511
        perm:
          type: integer
          format: int64
          minimum: 0
        ptrMode:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        ptrPerm:
          type: integer
          format: int64
          minimum: 0
          nullable: true
  securitySchemes:
    TenantID:
      type: apiKey
      in: header
      name: X-Tenant-ID
      description: Tenant identifier. Enforced only when the service runs with multitenancy enabled and a header-based tenant resolver; a missing or invalid tenant yields HTTP 400. Deployments resolving the tenant from the subdomain or URL path do not read this header.
security:
  - TenantID: []
