openapi: 3.0.1
info:
  title: Jsondash API
  version: 1.0.0
  description: Generated API specification
servers:
  - url: /
    description: Relative to the deployment host
paths:
  /items/{id}:
    get:
      operationId: jsondashGet
      summary: GET /items/{id}
      tags:
        - jsondash
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Bundle'
                  meta:
                    type: object
                    properties:
                      timestamp:
                        type: string
                        format: date-time
                        description: RFC3339 response timestamp
                      traceId:
                        type: string
                        description: W3C trace identifier for the request
        "400":
          description: Bad Request — malformed request or failed validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    Base:
      type: object
      properties:
        x:
          type: integer
          format: int64
    Bundle:
      type: object
      properties:
        comma:
          $ref: '#/components/schemas/DashComma'
        emb:
          $ref: '#/components/schemas/EmbDash'
        omit:
          $ref: '#/components/schemas/DashOmit'
        skipped:
          $ref: '#/components/schemas/Skipped'
    DashComma:
      type: object
      properties:
        '-':
          type: integer
          format: int64
        keep:
          type: integer
          format: int64
    DashOmit:
      type: object
      properties:
        '-':
          type: integer
          format: int64
        keep:
          type: integer
          format: int64
    EmbDash:
      type: object
      properties:
        '-':
          $ref: '#/components/schemas/Base'
        keep:
          type: integer
          format: int64
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Machine-readable error code (e.g. BAD_REQUEST, NOT_FOUND, INTERNAL_ERROR, or a custom business code)
            details:
              type: object
              properties:
                validationErrors:
                  type: array
                  description: Per-field validation failures (400 validation errors)
                  items:
                    type: object
                    properties:
                      field:
                        type: string
                        description: Field that failed validation
                      message:
                        type: string
                        description: Violated validation rule
                      value:
                        description: Submitted value (any type)
                  maxItems: 100
              description: Contextual error payload, emitted in development environments only
            message:
              type: string
              description: Human-readable error message
          description: Error details
        meta:
          type: object
          properties:
            timestamp:
              type: string
              format: date-time
              description: RFC3339 response timestamp
            traceId:
              type: string
              description: W3C trace identifier for the request
      required:
        - error
    Skipped:
      type: object
      properties:
        keep:
          type: integer
          format: int64
  securitySchemes:
    TenantID:
      type: apiKey
      in: header
      name: X-Tenant-ID
      description: Tenant identifier. Enforced only when the service runs with multitenancy enabled and a header-based tenant resolver; a missing or invalid tenant yields HTTP 400. Deployments resolving the tenant from the subdomain or URL path do not read this header.
security:
  - TenantID: []
