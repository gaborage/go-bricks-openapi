openapi: 3.0.1
info:
  title: Anonymousrequest API
  version: 1.0.0
  description: Generated API specification
servers:
  - url: /
    description: Relative to the deployment host
paths:
  /anon/{id}:
    post:
      operationId: anonymousrequestAnon
      summary: POST /anon/{id}
      tags:
        - anonymous
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: q
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: X-Trace
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body:
                  type: string
              required:
                - body
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Out'
                  meta:
                    type: object
                    properties:
                      timestamp:
                        type: string
                        format: date-time
                        description: RFC3339 response timestamp
                      traceId:
                        type: string
                        description: W3C trace identifier for the request
        "400":
          description: Bad Request — malformed request or failed validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /anonack:
    post:
      operationId: anonymousrequestAnonAck
      summary: POST /anonack
      tags:
        - anonymous
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ack:
                  $ref: '#/components/schemas/Ack'
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Out'
                  meta:
                    type: object
                    properties:
                      timestamp:
                        type: string
                        format: date-time
                        description: RFC3339 response timestamp
                      traceId:
                        type: string
                        description: W3C trace identifier for the request
        "400":
          description: Bad Request — malformed request or failed validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /anonparams/{id}:
    get:
      operationId: anonymousrequestAnonParams
      summary: GET /anonparams/{id}
      tags:
        - anonymous
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: q
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Out'
                  meta:
                    type: object
                    properties:
                      timestamp:
                        type: string
                        format: date-time
                        description: RFC3339 response timestamp
                      traceId:
                        type: string
                        description: W3C trace identifier for the request
        "400":
          description: Bad Request — malformed request or failed validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /anonsealed:
    post:
      operationId: anonymousrequestAnonSealed
      summary: POST /anonsealed
      tags:
        - anonymous
      requestBody:
        required: true
        description: |
          JOSE compact serialization (signed-then-encrypted). The wire payload
          is a base64url-encoded JWE compact form whose plaintext, after
          decrypt+verify, is the JSON encoding of the handler's anonymous
          request struct, which has no schema component.
        content:
          application/jose:
            schema:
              type: string
              format: jose
      responses:
        "200":
          description: |
            JOSE compact serialization (signed-then-encrypted). The wire payload
            is a base64url-encoded JWE compact form whose plaintext, after
            decrypt+verify, conforms to the SealedResp schema —
            see #/components/schemas/SealedResp.
          content:
            application/jose:
              schema:
                type: string
                format: jose
        "400":
          description: Bad Request — malformed request or failed validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JOSEErrorEnvelope'
        "401":
          description: Unauthorized — JOSE decrypt/verify failure (JOSE_DECRYPT_FAILED, JOSE_SIGNATURE_INVALID, JOSE_KID_UNKNOWN, JOSE_KID_MISSING)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JOSEErrorEnvelope'
        "415":
          description: Unsupported Media Type — plaintext request on a JOSE route (JOSE_PLAINTEXT_REJECTED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JOSEErrorEnvelope'
        "500":
          description: Internal Server Error
          content:
            application/jose:
              schema:
                type: string
                format: jose
            application/json:
              schema:
                $ref: '#/components/schemas/JOSEErrorEnvelope'
components:
  schemas:
    Ack:
      type: object
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Machine-readable error code (e.g. BAD_REQUEST, NOT_FOUND, INTERNAL_ERROR, or a custom business code)
            details:
              type: object
              properties:
                validationErrors:
                  type: array
                  description: Per-field validation failures (400 validation errors)
                  items:
                    type: object
                    properties:
                      field:
                        type: string
                        description: Field that failed validation
                      message:
                        type: string
                        description: Violated validation rule
                  maxItems: 100
              description: Contextual error payload, sent only when app.debug is enabled in a development environment
            message:
              type: string
              description: Human-readable error message
          description: Error details
        meta:
          type: object
          properties:
            timestamp:
              type: string
              format: date-time
              description: RFC3339 response timestamp
            traceId:
              type: string
              description: W3C trace identifier for the request
      required:
        - error
    JOSEErrorEnvelope:
      type: object
      properties:
        code:
          type: string
          description: Machine-readable JOSE error code (e.g., JOSE_DECRYPT_FAILED, JOSE_SIGNATURE_INVALID, JOSE_KID_UNKNOWN, JOSE_KID_MISSING, JOSE_PLAINTEXT_REJECTED)
        message:
          type: string
          description: Constant-time generic message — never reveals which key was tried or which library detected the failure
      required:
        - code
        - message
    Out:
      type: object
      properties:
        ok:
          type: boolean
    SealedResp:
      type: object
      properties:
        ok:
          type: boolean
  securitySchemes:
    TenantID:
      type: apiKey
      in: header
      name: X-Tenant-ID
      description: Tenant identifier. Enforced only when the service runs with multitenancy enabled and a header-based tenant resolver; a missing or invalid tenant yields HTTP 400. Deployments resolving the tenant from the subdomain or URL path do not read this header.
security:
  - TenantID: []
