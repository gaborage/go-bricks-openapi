components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Machine-readable error code (e.g. BAD_REQUEST, NOT_FOUND, INTERNAL_ERROR, or a custom business code)
            details:
              type: object
              properties:
                validationErrors:
                  type: array
                  description: Per-field validation failures (400 validation errors)
                  items:
                    type: object
                    properties:
                      field:
                        type: string
                        description: Field that failed validation
                      message:
                        type: string
                        description: Violated validation rule
                  maxItems: 100
              description: Contextual error payload, sent only when app.debug is enabled in a development environment
            message:
              type: string
              description: Human-readable error message
          description: Error details
        meta:
          type: object
          properties:
            timestamp:
              type: string
              format: date-time
              description: RFC3339 response timestamp
            traceId:
              type: string
              description: W3C trace identifier for the request
      required:
        - error
    Ledger:
      type: object
      properties:
        alias:
          type: string
          format: decimal
        amount:
          type: string
          format: decimal
          example: "12.50"
        amounts:
          type: array
          items:
            type: string
            format: decimal
          minItems: 1
        byName:
          type: object
          additionalProperties:
            type: string
            format: decimal
        count:
          type: integer
        due:
          type: string
          format: date
        grid:
          type: array
          items:
            type: array
            items:
              type: string
              format: decimal
        moneyPtr:
          type: string
          format: decimal
          nullable: true
        named:
          type: string
        rate:
          type: number
          format: double
        start:
          type: string
          format: date
          example: "2024-02-01"
        status:
          type: integer
          format: int64
      required:
        - amount
  securitySchemes:
    TenantID:
      type: apiKey
      in: header
      name: X-Tenant-ID
      description: Tenant identifier. Enforced only when the service runs with multitenancy enabled and a header-based tenant resolver; a missing or invalid tenant yields HTTP 400. Deployments resolving the tenant from the subdomain or URL path do not read this header.
security:
  - TenantID: []
