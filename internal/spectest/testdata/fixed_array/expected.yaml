components:
  schemas:
    Address:
      type: object
      properties:
        street:
          type: string
    CreateKeyReq:
      type: object
      properties:
        addrMap:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/Address'
        addrPtrs:
          type: array
          items:
            $ref: '#/components/schemas/Address'
        addrs:
          type: array
          items:
            $ref: '#/components/schemas/Address'
        amounts:
          type: array
          items:
            type: integer
            format: int64
            minimum: 1
        blobs:
          type: array
          items:
            type: string
            format: byte
        bounded:
          type: array
          items:
            type: integer
            format: int32
            minimum: 0
            maximum: 200
          minItems: 1
          maxItems: 4
        boundedWide:
          type: array
          items:
            type: integer
            format: int32
            minimum: 0
            maximum: 200
          minItems: 1
          maxItems: 4
        bytePtrs:
          type: array
          items:
            type: integer
            format: int32
            minimum: 0
        digest:
          type: array
          items:
            type: integer
            format: int32
            minimum: 0
        empty:
          type: array
          items:
            type: integer
            format: int32
            minimum: 0
        flags:
          type: array
          items:
            type: integer
            format: int32
            minimum: 0
        ints:
          type: array
          items:
            type: integer
            format: int64
        key:
          type: array
          items:
            type: integer
            format: int32
            minimum: 0
        keyMap:
          type: object
          additionalProperties:
            type: array
            items:
              type: integer
              format: int32
              minimum: 0
        keyPairs:
          type: array
          items:
            type: array
            items:
              type: integer
              format: int32
              minimum: 0
        keys:
          type: array
          items:
            type: array
            items:
              type: integer
              format: int32
              minimum: 0
        maybeAddrs:
          type: array
          items:
            $ref: '#/components/schemas/Address'
        maybeInts:
          type: array
          items:
            type: integer
            format: int64
        maybeKey:
          type: array
          items:
            type: integer
            format: int32
            minimum: 0
        maybeRaw:
          type: string
          format: byte
        names:
          type: array
          items:
            type: string
            minLength: 2
        octets:
          type: array
          items:
            type: integer
            format: int32
            minimum: 0
        raw:
          type: string
          format: byte
        rawOctets:
          type: string
          format: byte
        sample:
          type: array
          items:
            type: integer
            format: int32
            minimum: 0
        sampleWide:
          type: array
          items:
            type: integer
            format: int32
            minimum: 0
        sized:
          type: array
          items:
            type: integer
            format: int32
            minimum: 0
        wide:
          type: array
          items:
            type: integer
            format: int32
            minimum: 0
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Machine-readable error code (e.g. BAD_REQUEST, NOT_FOUND, INTERNAL_ERROR, or a custom business code)
            details:
              type: object
              properties:
                validationErrors:
                  type: array
                  description: Per-field validation failures (400 validation errors)
                  items:
                    type: object
                    properties:
                      field:
                        type: string
                        description: Field that failed validation
                      message:
                        type: string
                        description: Violated validation rule
                      value:
                        description: Submitted value (any type)
                  maxItems: 100
              description: Contextual error payload, emitted in development environments only
            message:
              type: string
              description: Human-readable error message
          description: Error details
        meta:
          type: object
          properties:
            timestamp:
              type: string
              format: date-time
              description: RFC3339 response timestamp
            traceId:
              type: string
              description: W3C trace identifier for the request
      required:
        - error
  securitySchemes:
    TenantID:
      type: apiKey
      in: header
      name: X-Tenant-ID
      description: Tenant identifier. Enforced only when the service runs with multitenancy enabled and a header-based tenant resolver; a missing or invalid tenant yields HTTP 400. Deployments resolving the tenant from the subdomain or URL path do not read this header.
security:
  - TenantID: []
