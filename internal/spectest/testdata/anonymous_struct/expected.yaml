openapi: 3.0.1
info:
  title: Anonymousstruct API
  version: 1.0.0
  description: Generated API specification
servers:
  - url: /
    description: Relative to the deployment host
paths:
  /report:
    get:
      operationId: anonymousstructReport
      summary: GET /report
      tags:
        - anonymous
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Report'
                  meta:
                    type: object
                    properties:
                      timestamp:
                        type: string
                        format: date-time
                        description: RFC3339 response timestamp
                      traceId:
                        type: string
                        description: W3C trace identifier for the request
        "400":
          description: Bad Request — malformed request or failed validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /reports/{id}:
    post:
      operationId: anonymousstructCreate
      summary: POST /reports/{id}
      tags:
        - anonymous
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: mode
          in: query
          required: false
          schema:
            type: object
            enum:
              - a
              - b
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReq'
      responses:
        "201":
          description: Resource created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Report'
                  meta:
                    type: object
                    properties:
                      timestamp:
                        type: string
                        format: date-time
                        description: RFC3339 response timestamp
                      traceId:
                        type: string
                        description: W3C trace identifier for the request
        "400":
          description: Bad Request — malformed request or failed validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    Ack:
      type: object
    CreateReq:
      type: object
      properties:
        meta:
          type: object
          properties:
            tag:
              type: string
              maxLength: 8
            x:
              type: integer
              format: int64
              minimum: 1
          required:
            - tag
      required:
        - meta
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Machine-readable error code (e.g. BAD_REQUEST, NOT_FOUND, INTERNAL_ERROR, or a custom business code)
            details:
              type: object
              properties:
                validationErrors:
                  type: array
                  description: Per-field validation failures (400 validation errors)
                  items:
                    type: object
                    properties:
                      field:
                        type: string
                        description: Field that failed validation
                      message:
                        type: string
                        description: Violated validation rule
                      value:
                        description: Submitted value (any type)
                  maxItems: 100
              description: Contextual error payload, emitted in development environments only
            message:
              type: string
              description: Human-readable error message
          description: Error details
        meta:
          type: object
          properties:
            timestamp:
              type: string
              format: date-time
              description: RFC3339 response timestamp
            traceId:
              type: string
              description: W3C trace identifier for the request
      required:
        - error
    Node:
      type: object
      properties:
        kids:
          type: array
          items:
            type: object
            properties:
              kids:
                type: array
                items: {}
              label:
                type: string
    Office:
      type: object
      properties:
        floor:
          type: integer
          format: int64
    Report:
      type: object
      properties:
        byKey:
          type: object
          additionalProperties:
            type: object
            properties:
              a:
                type: integer
                format: int64
        direct:
          type: object
          properties:
            a:
              type: integer
              format: int64
        empty:
          type: object
        id:
          type: string
        list:
          type: array
          items:
            type: object
            properties:
              a:
                type: integer
                format: int64
          minItems: 1
        nested:
          type: object
          properties:
            in:
              type: object
              properties:
                b:
                  type: string
        promoted:
          type: object
          properties:
            city:
              type: string
            z:
              type: integer
              format: int64
        ptr:
          type: object
          properties:
            a:
              type: integer
              format: int64
          description: An optional block
          nullable: true
        refs:
          type: object
          properties:
            a:
              $ref: '#/components/schemas/Ack'
            o:
              $ref: '#/components/schemas/Office'
        rows:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                format: int64
              name:
                type: string
                maxLength: 20
        skips:
          type: object
          properties:
            kept:
              type: integer
              format: int64
            untagged:
              type: boolean
        stamp: {}
        tree:
          $ref: '#/components/schemas/Node'
  securitySchemes:
    TenantID:
      type: apiKey
      in: header
      name: X-Tenant-ID
      description: Tenant identifier. Enforced only when the service runs with multitenancy enabled and a header-based tenant resolver; a missing or invalid tenant yields HTTP 400. Deployments resolving the tenant from the subdomain or URL path do not read this header.
security:
  - TenantID: []
