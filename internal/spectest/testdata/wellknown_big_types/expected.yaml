components:
  schemas:
    Embeds:
      type: object
      properties:
        float: {}
        int: {}
        ptrFloat:
          type: string
        ptrInt: {}
        ptrRat:
          type: string
        rat: {}
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Machine-readable error code (e.g. BAD_REQUEST, NOT_FOUND, INTERNAL_ERROR, or a custom business code)
            details:
              type: object
              properties:
                validationErrors:
                  type: array
                  description: Per-field validation failures (400 validation errors)
                  items:
                    type: object
                    properties:
                      field:
                        type: string
                        description: Field that failed validation
                      message:
                        type: string
                        description: Violated validation rule
                  maxItems: 100
              description: Contextual error payload, sent only when app.debug is enabled in a development environment
            message:
              type: string
              description: Human-readable error message
          description: Error details
        meta:
          type: object
          properties:
            timestamp:
              type: string
              format: date-time
              description: RFC3339 response timestamp
            traceId:
              type: string
              description: W3C trace identifier for the request
      required:
        - error
    Numbers:
      type: object
      properties:
        alias:
          type: integer
          nullable: true
        bounded:
          type: integer
          nullable: true
        defFloat:
          type: object
          nullable: true
        defInt:
          type: object
          nullable: true
        defRat:
          type: object
          nullable: true
        float:
          type: string
          nullable: true
        floats:
          type: object
          additionalProperties:
            type: string
        int:
          type: integer
          example: 42
          nullable: true
        ints:
          type: array
          items:
            type: integer
        ptrArr:
          type: array
          items: {}
        ptrMap:
          type: object
          additionalProperties: {}
        quoted:
          type: integer
          nullable: true
        quotedFloat:
          type: string
          nullable: true
        rat:
          type: string
          nullable: true
        valFloat: {}
        valInt: {}
        valRat: {}
  securitySchemes:
    TenantID:
      type: apiKey
      in: header
      name: X-Tenant-ID
      description: Tenant identifier. Enforced only when the service runs with multitenancy enabled and a header-based tenant resolver; a missing or invalid tenant yields HTTP 400. Deployments resolving the tenant from the subdomain or URL path do not read this header.
security:
  - TenantID: []
