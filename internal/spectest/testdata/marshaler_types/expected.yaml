  /jose:
    post:
      operationId: marshalertypesJose
      summary: POST /jose
      requestBody:
        required: true
        description: |
          JOSE compact serialization (signed-then-encrypted). The wire payload
          is a base64url-encoded JWE compact form whose plaintext, after
          decrypt+verify, is its type's own JSON encoding, which is not documented.
        content:
          application/jose:
            schema:
              type: string
              format: jose
      responses:
        "200":
          description: |
            JOSE compact serialization (signed-then-encrypted). The wire payload
            is a base64url-encoded JWE compact form whose plaintext, after
            decrypt+verify, is its type's own JSON encoding, which is not documented.
          content:
            application/jose:
              schema:
                type: string
                format: jose
        "400":
          description: Bad Request — malformed request or failed validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JOSEErrorEnvelope'
        "401":
          description: Unauthorized — JOSE decrypt/verify failure (JOSE_DECRYPT_FAILED, JOSE_SIGNATURE_INVALID, JOSE_KID_UNKNOWN, JOSE_KID_MISSING)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JOSEErrorEnvelope'
        "415":
          description: Unsupported Media Type — plaintext request on a JOSE route (JOSE_PLAINTEXT_REJECTED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JOSEErrorEnvelope'
        "500":
          description: Internal Server Error
          content:
            application/jose:
              schema:
                type: string
                format: jose
            application/json:
              schema:
                $ref: '#/components/schemas/JOSEErrorEnvelope'
