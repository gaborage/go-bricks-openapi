        raw: {}
        shadow: {}
        stamped: {}
        statusV: {}
        tag:
          type: string
        taggedEmb:
          type: string
        textApp:
          type: string
        textJ: {}
        toText: {}
        twin: {}
        withCode:
          type: string
        withID:
          type: string
        withInner: {}
        wrapLevel:
          type: string
        wrapper: {}
      required:
        - level
    Filter:
      type: object
    JOSEErrorEnvelope:
      type: object
      properties:
        code:
          type: string
          description: Machine-readable JOSE error code (e.g., JOSE_DECRYPT_FAILED, JOSE_SIGNATURE_INVALID, JOSE_KID_UNKNOWN, JOSE_KID_MISSING, JOSE_PLAINTEXT_REJECTED)
        message:
          type: string
          description: Constant-time generic message — never reveals which key was tried or which library detected the failure
      required:
        - code
        - message
    MD:
