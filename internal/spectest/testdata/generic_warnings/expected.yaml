components:
  schemas:
    Controls:
      type: object
      properties:
        anon:
          type: object
          properties:
            x:
              type: integer
              format: int64
        ch:
          type: object
        fn:
          type: object
        note:
          type: string
        nt:
          type: object
          additionalProperties: {}
        x:
          type: object
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Machine-readable error code (e.g. BAD_REQUEST, NOT_FOUND, INTERNAL_ERROR, or a custom business code)
            details:
              type: object
              properties:
                validationErrors:
                  type: array
                  description: Per-field validation failures (400 validation errors)
                  items:
                    type: object
                    properties:
                      field:
                        type: string
                        description: Field that failed validation
                      message:
                        type: string
                        description: Violated validation rule
                      value:
                        description: Submitted value (any type)
                  maxItems: 100
              description: Contextual error payload, emitted in development environments only
            message:
              type: string
              description: Human-readable error message
          description: Error details
        meta:
          type: object
          properties:
            timestamp:
              type: string
              format: date-time
              description: RFC3339 response timestamp
            traceId:
              type: string
              description: W3C trace identifier for the request
      required:
        - error
    Fields:
      type: object
      properties:
        aap:
          type: object
        al:
          type: object
        ap:
          type: object
        b:
          type: object
        jb:
          type: object
        l:
          type: object
        lp:
          type: array
          items:
            type: object
        mb:
          type: object
          additionalProperties:
            type: object
        mo:
          type: object
        p:
          type: object
        page:
          type: object
        pb:
          type: object
          nullable: true
        pgl:
          type: object
        pgp:
          type: object
        pr:
          type: object
        sb:
          type: array
          items:
            type: object
        tb:
          type: object
        tr:
          type: object
        ud:
          type: object
    Receipt:
      type: object
      properties:
        id:
          type: string
  securitySchemes:
    TenantID:
      type: apiKey
      in: header
      name: X-Tenant-ID
      description: Tenant identifier. Enforced only when the service runs with multitenancy enabled and a header-based tenant resolver; a missing or invalid tenant yields HTTP 400. Deployments resolving the tenant from the subdomain or URL path do not read this header.
security:
  - TenantID: []
