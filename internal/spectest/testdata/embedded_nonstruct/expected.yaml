openapi: 3.0.1
info:
  title: Embeddednonstruct API
  version: 1.0.0
  description: Generated API specification
servers:
  - url: /
    description: Relative to the deployment host
paths:
  /rows:
    get:
      operationId: embeddednonstructRows
      summary: GET /rows
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Rows'
                  meta:
                    type: object
                    properties:
                      timestamp:
                        type: string
                        format: date-time
                        description: RFC3339 response timestamp
                      traceId:
                        type: string
                        description: W3C trace identifier for the request
        "400":
          description: Bad Request — malformed request or failed validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /search/{id}:
    get:
      operationId: embeddednonstructSearch
      summary: GET /search/{id}
      parameters:
        - name: min
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Rows'
                  meta:
                    type: object
                    properties:
                      timestamp:
                        type: string
                        format: date-time
                        description: RFC3339 response timestamp
                      traceId:
                        type: string
                        description: W3C trace identifier for the request
        "400":
          description: Bad Request — malformed request or failed validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /stamped/{id}:
    get:
      operationId: embeddednonstructStamped
      summary: GET /stamped/{id}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Rows'
                  meta:
                    type: object
                    properties:
                      timestamp:
                        type: string
                        format: date-time
                        description: RFC3339 response timestamp
                      traceId:
                        type: string
                        description: W3C trace identifier for the request
        "400":
          description: Bad Request — malformed request or failed validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    Collided:
      type: object
      properties:
        Cents:
          type: string
    Dropped:
      type: object
      properties:
        kept:
          type: string
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Machine-readable error code (e.g. BAD_REQUEST, NOT_FOUND, INTERNAL_ERROR, or a custom business code)
            details:
              type: object
              properties:
                validationErrors:
                  type: array
                  description: Per-field validation failures (400 validation errors)
                  items:
                    type: object
                    properties:
                      field:
                        type: string
                        description: Field that failed validation
                      message:
                        type: string
                        description: Violated validation rule
                      value:
                        description: Submitted value (any type)
                  maxItems: 100
              description: Contextual error payload, emitted in development environments only
            message:
              type: string
              description: Human-readable error message
          description: Error details
        meta:
          type: object
          properties:
            timestamp:
              type: string
              format: date-time
              description: RFC3339 response timestamp
            traceId:
              type: string
              description: W3C trace identifier for the request
      required:
        - error
    Named:
      type: object
      properties:
        h:
          $ref: '#/components/schemas/hidden'
        keep:
          type: integer
          format: int64
    Promoted:
      type: object
      properties:
        id:
          type: integer
          format: int64
        label:
          type: string
    PromotedB:
      type: object
      properties:
        extra:
          type: integer
          format: int64
        id:
          type: integer
          format: int64
    Rows:
      type: object
      properties:
        collided:
          $ref: '#/components/schemas/Collided'
        dropped:
          $ref: '#/components/schemas/Dropped'
        named:
          $ref: '#/components/schemas/Named'
        promB:
          $ref: '#/components/schemas/PromotedB'
        promoted:
          $ref: '#/components/schemas/Promoted'
        scalars:
          $ref: '#/components/schemas/Scalars'
        shadowed:
          $ref: '#/components/schemas/Shadowed'
    Scalars:
      type: object
      properties:
        Attrs:
          type: object
          additionalProperties:
            type: string
        CA:
          type: integer
          format: int64
        Cents:
          type: integer
          format: int64
        Duration:
          type: integer
          format: int64
        Namer: {}
        RawD:
          type: string
          format: byte
        Tags:
          type: array
          items:
            type: string
        note:
          type: string
    Shadowed:
      type: object
      properties:
        Cents:
          type: string
    hidden:
      type: object
      properties:
        detail:
          type: string
  securitySchemes:
    TenantID:
      type: apiKey
      in: header
      name: X-Tenant-ID
      description: Tenant identifier. Enforced only when the service runs with multitenancy enabled and a header-based tenant resolver; a missing or invalid tenant yields HTTP 400. Deployments resolving the tenant from the subdomain or URL path do not read this header.
security:
  - TenantID: []
