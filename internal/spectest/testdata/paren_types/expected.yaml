components:
  schemas:
    Base:
      type: object
      properties:
        x:
          type: integer
          format: int64
    CreateReq:
      type: object
      properties:
        name:
          type: string
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Machine-readable error code (e.g. BAD_REQUEST, NOT_FOUND, INTERNAL_ERROR, or a custom business code)
            details:
              type: object
              properties:
                validationErrors:
                  type: array
                  description: Per-field validation failures (400 validation errors)
                  items:
                    type: object
                    properties:
                      field:
                        type: string
                        description: Field that failed validation
                      message:
                        type: string
                        description: Violated validation rule
                  maxItems: 100
              description: Contextual error payload, sent only when app.debug is enabled in a development environment
            message:
              type: string
              description: Human-readable error message
          description: Error details
        meta:
          type: object
          properties:
            timestamp:
              type: string
              format: date-time
              description: RFC3339 response timestamp
            traceId:
              type: string
              description: W3C trace identifier for the request
      required:
        - error
    Named:
      type: object
      properties:
        a:
          type: integer
          format: int64
    PB:
      type: object
      properties:
        x:
          type: integer
          format: int64
    PBA:
      type: object
      properties:
        x:
          type: integer
          format: int64
    PS:
      type: object
      properties:
        "y":
          type: string
    Req:
      type: object
      properties:
        body:
          type: integer
          format: int64
    Resp:
      type: object
      properties:
        PC:
          type: integer
          format: int64
        b:
          $ref: '#/components/schemas/PB'
        ba:
          $ref: '#/components/schemas/PBA'
        c:
          type: integer
          format: int64
        paren:
          type: integer
          format: int64
        pelem:
          type: array
          items:
            $ref: '#/components/schemas/Base'
        pparen:
          type: string
          nullable: true
        s:
          $ref: '#/components/schemas/PS'
        sl:
          type: array
          items:
            $ref: '#/components/schemas/Base'
  securitySchemes:
    TenantID:
      type: apiKey
      in: header
      name: X-Tenant-ID
      description: Tenant identifier. Enforced only when the service runs with multitenancy enabled and a header-based tenant resolver; a missing or invalid tenant yields HTTP 400. Deployments resolving the tenant from the subdomain or URL path do not read this header.
security:
  - TenantID: []
